:root{--bg:#f4f3ed;--ink:#213e39;--muted:#687772;--line:#d8dfd6;--green:#235a47;--soft:#e5ecdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:38px 28px 64px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.header-actions{display:flex;align-items:flex-end;gap:10px;flex-direction:column}.eyebrow{font-size:12px;letter-spacing:0;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(26px,4vw,40px);letter-spacing:0;margin:6px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.badge{border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-size:12px;white-space:nowrap}.watch-link{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;border:1px solid var(--green);border-radius:8px;padding:10px 16px;font-weight:650;white-space:nowrap}.watch-link:hover{background:#174535}.watch-link:focus-visible{outline:3px solid #d99945;outline-offset:3px}.stats{display:flex;gap:28px;margin:24px 0}.stats strong{font-size:28px;margin-right:8px}nav,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d99945;outline-offset:3px}.primary,button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.toolbar{justify-content:space-between;margin:22px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:32px 40px;min-height:370px;box-shadow:0 12px 35px #213e3906}.sentence{font-family:Georgia,serif;font-size:clamp(25px,4vw,36px);line-height:1.5;margin:28px 0;color:#193e33}.answer{border-top:1px solid var(--line);margin:22px 0;padding-top:18px}.term{font-size:22px;font-weight:650}.ipa{font-size:16px;color:var(--muted);font-weight:400;margin-left:12px}.actions{margin-top:24px}.bottom{justify-content:space-between;margin-top:18px;display:flex;gap:12px;align-items:center}.hint{font-size:12px;color:var(--muted)}input[type=search]{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:white;margin:22px 0}.word{background:white;border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:12px}.word-top{display:flex;justify-content:space-between;gap:12px}.word p{overflow-wrap:anywhere}.word .example{font-family:Georgia,serif;font-size:20px}footer{margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}footer .actions{margin-top:12px}#notice{min-height:24px;color:#855220;font-size:14px}#source-list{overflow-wrap:anywhere}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:620px){main{padding:24px 16px}header{display:block}.header-actions{align-items:flex-start;margin-top:14px}.badge{display:inline-block;margin-top:10px}.card{padding:22px;min-height:360px}.watch-link{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;border:1px solid var(--green);border-radius:8px;padding:10px 16px;font-weight:650;white-space:nowrap}.watch-link:hover{background:#174535}.watch-link:focus-visible{outline:3px solid #d99945;outline-offset:3px}.stats{gap:18px}.stats strong{font-size:23px}.bottom{align-items:flex-start;flex-direction:column}.actions button{flex:1}.word{padding:16px}}

<body><main>
<header><div><div class="eyebrow">JUYOUCI / 剧有词</div><h1 id="title"></h1><p class="muted">看一集，学几句。</p><p><a href="../index.html">← 返回剧集书架</a>　<a href="https://www.youtube.com/watch?v=Qb7GNu3NN-E" target="_blank" rel="noopener noreferrer">▶ 免费观看完整第二集</a></p></div><div class="header-actions"><span class="badge">完整单集 · 免费学习</span><a class="watch-link" href="https://www.youtube.com/watch?v=Qb7GNu3NN-E" target="_blank" rel="noopener noreferrer" aria-label="在 YouTube 免费观看 The Guild 第一季第二集"><span aria-hidden="true">▶</span> 免费观看本集</a></div></header>
<div class="stats" aria-label="学习统计"><div><strong id="total">0</strong>词条</div><div><strong id="learned">0</strong>本轮记住</div><div><strong id="remaining">0</strong>待完成</div></div>
<nav aria-label="页面模式"><button id="study-tab" aria-pressed="true">学习与回忆</button><button id="list-tab" aria-pressed="false">词汇总览</button></nav>
<section id="study"><div class="toolbar"><label>练习范围 <select id="filter"><option value="unlearned">继续学习</option><option value="again">需要再练</option><option value="all">全部复习</option></select></label><button id="shuffle">打乱顺序</button></div>
<div class="card"><div class="eyebrow" id="position"></div><h2 class="target" id="target"></h2><p class="muted" id="prompt"></p><p class="sentence" id="sentence"></p><div class="answer" id="answer"><div><span class="term" id="term"></span><span class="ipa" id="ipa"></span></div><p id="meaning"></p><p id="translation"></p></div><div class="actions"><button class="primary" id="start">学过了，稍后考我</button><button class="primary" id="reveal" hidden>核对答案</button><button id="speak">朗读原句</button></div><div class="actions" id="ratings" hidden><button id="again">没想起来</button><button class="primary" id="known">想起来了</button></div></div>
<p class="hint">先学词 → 回忆词义 → 回想英文。请先在心里作答，再核对答案；答错会自动排回队列。间隔最多 3 张，不足时提前出现。</p></section>

</main><script type="application/json" id="vocab-data">{"title": "The Guild S01E02 · Zaboo'd", "deck_id": "the-guild:S01E02:zh", "cards": [{"term": "friendly online", "meaning": "在网上保持友好往来", "ipa": "/ˈfrendli ˌɒnˈlaɪn/", "sentence": "I mean, I've been friendly online with Zaboo.", "translation": "我是说，我只是在网上和扎布保持友好。", "target_spans": [[18, 33]], "id": "f06a227a1abddacde2ad"}, {"term": "coworker", "meaning": "同事", "ipa": "/ˈkoʊˌwɜːrkər/", "sentence": "But nothing you wouldn't say to a coworker you see, like, five to eight, nine hours a day.", "translation": "但那些话也不过是你会对一个每天见五到九小时的同事说的。", "target_spans": [[34, 42]], "id": "6dbdd7aeb702a43bb5ad"}, {"term": "online flirtation", "meaning": "网络暧昧；网上调情", "ipa": "/ˌɒnˈlaɪn flɜːrˈteɪʃən/", "sentence": "I guess online flirtation can be interpreted many ways.", "translation": "我想网络暧昧可以有很多种解读。", "target_spans": [[8, 25]], "id": "b661be6b4c3a6e6cfd65"}, {"term": "delusional", "meaning": "妄想的；脱离现实的", "ipa": "/dɪˈluːʒənəl/", "sentence": "Especially if you're delusional.", "translation": "尤其是当你有妄想的时候。", "target_spans": [[21, 31]], "id": "8018fc205abce2dae319"}, {"term": "track someone down", "meaning": "追查并找到某人", "ipa": "/træk ˈsʌmwʌn daʊn/", "sentence": "It was pretty easy to track you down 'cause I'm awesome.", "translation": "找到你相当容易，因为我很厉害。", "target_spans": [[22, 36]], "id": "02f2a07374935e9a8bd6"}, {"term": "physical realm", "meaning": "现实世界；物理空间", "ipa": "/ˈfɪzɪkəl relm/", "sentence": "I came here to the physical realm to hold you.", "translation": "我来到现实世界就是为了拥抱你。", "target_spans": [[19, 33]], "id": "f603b92a5f3fff60e3ce"}, {"term": "long-distance relationship", "meaning": "异地恋", "ipa": "/ˌlɒŋ ˈdɪstəns rɪˈleɪʃənʃɪp/", "sentence": "This long-distance thing is killing our relationship.", "translation": "这种异地状态正在毁掉我们的关系。", "target_spans": [[5, 24]], "id": "9fe3f509763c86b5fdaf"}, {"term": "say otherwise", "meaning": "表明情况并非如此", "ipa": "/seɪ ˈʌðərwaɪz/", "sentence": "This chat log says otherwise.", "translation": "这份聊天记录可不是这么说的。", "target_spans": [[14, 28]], "id": "0cd16ab2724ed399dd05"}, {"term": "ruin our relationship", "meaning": "破坏我们的关系", "ipa": "/ˈruːɪn aʊər rɪˈleɪʃənʃɪp/", "sentence": "I don't want to ruin our relationship.", "translation": "我不想破坏我们的关系。", "target_spans": [[16, 37]], "id": "e0e4f3437de24dec5052"}, {"term": "keyboard error", "meaning": "键盘输入错误", "ipa": "/ˈkiːbɔːrd ˈerər/", "sentence": "Because that was just a keyboard error.", "translation": "因为那只是一次键盘输入错误。", "target_spans": [[24, 38]], "id": "0bf277113804a7426b41"}, {"term": "Freudian slip", "meaning": "弗洛伊德式口误；无意中泄露真实想法", "ipa": "/ˌfrɔɪdiən ˈslɪp/", "sentence": "It's a Freudian slip.", "translation": "这是一次泄露真实想法的口误。", "target_spans": [[7, 20]], "id": "0e522411c6675f25ddbb"}, {"term": "undeniable", "meaning": "不可否认的", "ipa": "/ˌʌndɪˈnaɪəbəl/", "sentence": "Our keyboard chemistry is undeniable.", "translation": "我们在键盘上的默契不可否认。", "target_spans": [[26, 36]], "id": "c41ded60b13bc0702371"}, {"term": "floor plan", "meaning": "楼层平面图", "ipa": "/ˈflɔːr plæn/", "sentence": "I know every floor plan of every place you've ever lived.", "translation": "你住过的每个地方，我都知道它的平面图。", "target_spans": [[13, 23]], "id": "01a4dc6291adca749f2c"}, {"term": "inappropriate", "meaning": "不合适的；越界的", "ipa": "/ˌɪnəˈproʊpriət/", "sentence": "That is inappropriate.", "translation": "这太越界了。", "target_spans": [[8, 21]], "id": "bf51f298ff8f8b8c3a93"}, {"term": "live it up", "meaning": "尽情享乐；痛快玩乐", "ipa": "/lɪv ɪt ʌp/", "sentence": "You should live it up.", "translation": "你们应该尽情享受。", "target_spans": [[11, 21]], "id": "f63093777dd75cbb95bd"}], "sources": ["https://www.springfieldspringfield.co.uk/view_episode_scripts.php?episode=s01e02\u0026tv-show=the-guild-2007", "https://www.youtube.com/watch?v=Qb7GNu3NN-E"], "note": ""}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('vocab-data').textContent), $=id=>document.getElementById(id);
const key='series-vocab:v1:'+D.deck_id, ids=new Set(D.cards.map(c=>c.id));
let progress={}, queue=[],revealed=false,mode='study';
const cardById=new Map(D.cards.map(c=>[c.id,c]));
function notify(s){$('notice').textContent=s;}
function cleanProgress(p){if(!p||typeof p!=='object'||Array.isArray(p))throw Error('进度格式不正确');const out={};for(const [id,v] of Object.entries(p)){if(!ids.has(id))continue;if(!['known','again','studied','meaning'].includes(v))throw Error('进度状态不正确');out[id]=v;}return out;}
try{const saved=localStorage.getItem(key);if(saved)progress=cleanProgress(JSON.parse(saved));}catch(e){notify('无法读取本地进度；本次仍可学习，请使用导出进度保存。');}
function save(){try{localStorage.setItem(key,JSON.stringify(progress));}catch(e){notify('浏览器未允许保存进度，请点击“导出进度”备份。');}}
function stats(){$('total').textContent=D.cards.length;const n=D.cards.filter(c=>progress[c.id]==='known').length;$('learned').textContent=n;$('remaining').textContent=D.cards.length-n;}
function current(){return queue.length?cardById.get(queue[0].id):null;}
function rebuild(){queue=D.cards.filter(c=>$('filter').value==='all'||($('filter').value==='again'?progress[c.id]==='again':progress[c.id]!=='known')).map(c=>({id:c.id,phase:!progress[c.id]?'learn':progress[c.id]==='meaning'?'cloze':'meaning'}));render();}
function sentence(c,blank){$('sentence').replaceChildren();let at=0;for(const [start,end] of c.target_spans){$('sentence').append(document.createTextNode(c.sentence.slice(at,start)));const m=document.createElement('mark');m.textContent=blank?'________':c.sentence.slice(start,end);$('sentence').append(m);at=end;}$('sentence').append(document.createTextNode(c.sentence.slice(at)));}
function render(){stats();revealed=false;$('ratings').hidden=true;const c=current();const phase=queue[0]?.phase;
for(const id of ['start','reveal','speak'])$(id).hidden=!c;
$('answer').hidden=!c||phase!=='learn';$('target').hidden=!c;
if(!c){$('position').textContent='本组练习完成';$('sentence').textContent='休息一下吧。之后可以选择“全部复习”再练。';$('prompt').textContent='本轮记住不等于长期掌握，建议过几天再回来复习。';return;}
$('position').textContent=({learn:'01 · 学习新词',meaning:'02 · 回忆词义',cloze:'03 · 回想英文'})[phase]+` · 队列剩余 ${queue.length} 项`;
$('target').textContent=phase==='cloze'?c.meaning:c.term;
$('prompt').textContent=phase==='learn'?'看词义，再结合原句理解。准备好后，稍后会考你。':phase==='meaning'?'标出的词或短语在这句话中是什么意思？':'根据中文意思，回想空格处的英文（按原句形式）。';
sentence(c,phase==='cloze');
for(const f of ['term','ipa','meaning','translation'])$(f).textContent=c[f];
$('start').hidden=phase!=='learn';$('reveal').hidden=phase==='learn';$('reveal').textContent='核对答案';$('speak').hidden=phase==='cloze';}
function reveal(){const c=current();if(!c||queue[0].phase==='learn')return;revealed=true;$('answer').hidden=false;$('ratings').hidden=false;$('reveal').hidden=true;$('speak').hidden=false;if(queue[0].phase==='cloze')sentence(c,false);}
function enqueue(task){queue.splice(Math.min(3,queue.length),0,task);}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function study(){if(queue[0]?.phase!=='learn')return;stopVoice();const task=queue.shift();progress[task.id]='studied';enqueue({id:task.id,phase:'meaning'});save();render();}
function rate(value){if(!revealed||!current())return;stopVoice();const task=queue.shift();if(value==='again'){progress[task.id]='again';enqueue({id:task.id,phase:'meaning'});}else if(task.phase==='meaning'){progress[task.id]='meaning';enqueue({id:task.id,phase:'cloze'});}else{progress[task.id]='known';}save();render();}
function list(){const q=$('search').value.trim().toLocaleLowerCase();const rows=D.cards.filter(c=>[c.term,c.meaning,c.sentence,c.translation].join(' ').toLocaleLowerCase().includes(q));$('results').textContent=`找到 ${rows.length} 个词条`;$('words').replaceChildren();for(const c of rows){const el=document.createElement('article');el.className='word';const top=document.createElement('div');top.className='word-top';const term=document.createElement('strong');term.textContent=c.term;const status=document.createElement('span');status.className='hint';status.textContent=progress[c.id]==='known'?'本轮记住':progress[c.id]==='again'?'需要再练':progress[c.id]?'练习中':'未学习';top.append(term,status);el.append(top);for(const [txt,cls]of [[c.ipa,'muted'],[c.meaning,''],[c.sentence,'example'],[c.translation,'muted']]){const p=document.createElement('p');p.textContent=txt;p.className=cls;el.append(p);}$('words').append(el);}}
function switchMode(m){mode=m;$('study').hidden=m!=='study';$('list').hidden=m!=='list';$('study-tab').setAttribute('aria-pressed',m==='study');$('list-tab').setAttribute('aria-pressed',m==='list');if(m==='list')list();}
$('title').textContent=D.title;document.title=D.title+' · 剧有词';$('note').textContent=D.note;
for(const s of D.sources){const p=document.createElement('p');if(/^https?:\/\//i.test(s)){const a=document.createElement('a');a.href=s;a.textContent=s;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}else p.textContent=s;$('source-list').append(p);}
$('study-tab').onclick=()=>switchMode('study');$('list-tab').onclick=()=>switchMode('list');$('search').oninput=list;$('filter').onchange=rebuild;$('reveal').onclick=reveal;$('start').onclick=study;$('known').onclick=()=>rate('known');$('again').onclick=()=>rate('again');
$('shuffle').onclick=()=>{for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}render();};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){notify('当前浏览器不支持朗读，翻卡和复习仍可使用。');return;}const c=current();if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.sentence);u.lang='en-US';u.rate=.85;u.onerror=()=>notify('朗读暂不可用，请检查设备语音或网络。');speechSynthesis.speak(u);};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,deck_id:D.deck_id,progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vocab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('已导出学习进度。');};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const obj=JSON.parse(await f.text());if(obj.version!==1||obj.deck_id!==D.deck_id)throw Error('这份进度不属于当前词汇页');const p=cleanProgress(obj.progress);if(!confirm('导入会替换当前学习进度，继续吗？'))return;progress=p;save();rebuild();list();notify('进度已导入。');}catch(e){notify('导入失败：'+e.message);}finally{$('file').value='';}};
$('reset').onclick=()=>{if(!confirm('确定清除这一集的学习进度吗？'))return;progress={};save();rebuild();list();notify('已重置本集进度。');};
rebuild();
</script><script src="../assets/selection-tools.js"></script></body></html>
