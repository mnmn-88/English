</main><script type="application/json" id="vocab-data">{"title":"House of Cards · Frank's Most Ruthless Moments","deck_id":"house-of-cards:ruthless-moments:zh","cards":[{"translation":"我觉得你是对的。我们应该重新开始。","sentence":"I think you're right. We should start with a clean slate.","id":"176831df3a7a0624381f","target_spans":[[45,56]],"meaning":"重新开始；既往不咎","term":"clean slate","ipa":"/kliːn sleɪt/"},{"translation":"我们可以把这件事抛在脑后，重新彼此信任。","sentence":"We could put this behind us and trust one another.","id":"581894affc705aa79cbe","target_spans":[[9,27]],"meaning":"把不愉快的事情抛在脑后","term":"put this behind us","ipa":"/pʊt ðɪs bɪˈhaɪnd ʌs/"},{"translation":"我在职业和身体关系上都越过了道德界线，我会为此负责。","sentence":"I crossed ethical lines professionally, physically, and I hold myself accountable for that.","id":"419a7f0866401440233f","target_spans":[[58,81]],"meaning":"为自己的行为负责","term":"hold myself accountable","ipa":"/hoʊld maɪˈself əˈkaʊntəbəl/"},{"translation":"我想继续向前，但我必须确切知道自己参与了什么。","sentence":"I'd like to move forward, but I need to know exactly what I was a part of.","id":"cd7df4c457de5d4b8bec","target_spans":[[12,24]],"meaning":"继续向前；翻篇","term":"move forward","ipa":"/muːv ˈfɔːrwərd/"},{"translation":"鲁索重新酗酒的那晚，他参加了一场筹款活动。","sentence":"The night Russo fell off the wagon, he was at a fundraiser.","id":"414676c4b2ec697dcbf3","target_spans":[[16,34]],"meaning":"故态复萌；戒酒后再次喝酒","term":"fell off the wagon","ipa":"/fel ɔːf ðə ˈwæɡən/"},{"translation":"我直截了当地告诉她，我不想要孩子。","sentence":"I told her flat out I didn't want any children.","id":"f3ca91a09cc77382161b","target_spans":[[11,19]],"meaning":"直截了当地；明确地","term":"flat out","ipa":"/flæt aʊt/"},{"translation":"我们有的是时间。","sentence":"We have all the time in the world.","id":"07e34b7850f6a997a5c9","target_spans":[[8,33]],"meaning":"有的是时间；时间非常充裕","term":"all the time in the world","ipa":"/ɔːl ðə taɪm ɪn ðə wɜːrld/"},{"translation":"你说你想商量出一个折中方案。","sentence":"You said you wanted to work out a compromise.","id":"c5488d8903ceab332c78","target_spans":[[23,44]],"me 888","target_spans":[[19,44]],"meaning":"获得同样多的支持或关注","term":"get just as much traction","ipa":"/ɡet dʒʌst æz mʌtʃ ˈtrækʃən/"},{"translation":"那个提议仍然有效。","sentence":"That offer is still on the table.","id":"f863c66115023ef9eeda","target_spans":[[20,32]],"meaning":"仍可供讨论；尚未撤回","term":"on the table","ipa":"/ɑːn ðə ˈteɪbəl/"},{"translation":"你会交出代表票，并继续在我的内阁任职。","sentence":"You will hand over your delegates and you will serve on in my cabinet.","id":"f75dfcc39f348da8ec2d","target_spans":[[9,18]],"meaning":"交出；移交","term":"hand over","ipa":"/hænd ˈoʊvər/"}],"sources":["https://www.youtube.com/watch?v=GW00_e3Mebs"],"note":"视频由 YouTube 频道 Clip 整理，片长 22 分 27 秒；词句依据视频英文字幕整理。"}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('vocab-data').textContent), $=id=>document.getElementById(id);
const key='series-vocab:v1:'+D.deck_id, ids=new Set(D.cards.map(c=>c.id));
let progress={}, queue=[],revealed=false,mode='study';
const cardById=new Map(D.cards.map(c=>[c.id,c]));
function notify(s){$('notice').textContent=s;}
function cleanProgress(p){if(!p||typeof p!=='object'||Array.isArray(p))throw Error('进度格式不正确');const out={};for(const [id,v] of Object.entries(p)){if(!ids.has(id))continue;if(!['known','again','studied','meaning'].includes(v))throw Error('进度状态不正确');out[id]=v;}return out;}
try{const saved=localStorage.getItem(key);if(saved)progress=cleanProgress(JSON.parse(saved));}catch(e){notify('无法读取本地进度；本次仍可学习，请使用导出进度保存。');}
function save(){try{localStorage.setItem(key,JSON.stringify(progress));}catch(e){notify('浏览器未允许保存进度，请点击“导出进度”备份。');}}
function stats(){$('total').textContent=D.cards.length;const n=D.cards.filter(c=>progress[c.id]==='known').length;$('learned').textContent=n;$('remaining').textContent=D.cards.length-n;}
function current(){return queue.length?cardById.get(queue[0].id):null;}
function rebuild(){queue=D.cards.filter(c=>$('filter').value==='all'||($('filter').value==='again'?progress[c.id]==='again':progress[c.id]!=='known')).map(c=>({id:c.id,phase:!progress[c.id]?'learn':progress[c.id]==='meaning'?'cloze':'meaning'}));render();}
function sentence(c,blank){$('sentence').replaceChildren();let at=0;for(const [start,end] of c.target_spans){$('sentence').append(document.createTextNode(c.sentence.slice(at,start)));const m=document.createElement('mark');m.textContent=blank?'________':c.sentence.slice(start,end);$('sentence').append(m);at=end;}$('sentence').append(document.createTextNode(c.sentence.slice(at)));}
function render(){stats();revealed=false;$('ratings').hidden=true;const c=current();const phase=queue[0]?.phase;
for(const id of ['start','reveal','speak'])$(id).hidden=!c;
$('answer').hidden=!c||phase!=='learn';$('target').hidden=!c;
if(!c){$('position').textContent='本组练习完成';$('sentence').textContent='休息一下吧。之后可以选择“全部复习”再练。';$('prompt').textContent='本轮记住不等于长期掌握，建议过几天再回来复习。';return;}
$('position').textContent=({learn:'01 · 学习新词',meaning:'02 · 回忆词义',cloze:'03 · 回想英文'})[phase]+` · 队列剩余 ${queue.length} 项`;
$('target').textContent=phase==='cloze'?c.meaning:c.term;
$('prompt').textContent=phase==='learn'?'看词义，再结合原句理解。准备好后，稍后会考你。':phase==='meaning'?'标出的词或短语在这句话中是什么意思？':'根据中文意思，回想空格处的英文（按原句形式）。';
sentence(c,phase==='cloze');
for(const f of ['term','ipa','meaning','translation'])$(f).textContent=c[f];
$('start').hidden=phase!=='learn';$('reveal').hidden=phase==='learn';$('reveal').textContent='核对答案';$('speak').hidden=phase==='cloze';}
function reveal(){const c=current();if(!c||queue[0].phase==='learn')return;revealed=true;$('answer').hidden=false;$('ratings').hidden=false;$('reveal').hidden=true;$('speak').hidden=false;if(queue[0].phase==='cloze')sentence(c,false);}
function enqueue(task){queue.splice(Math.min(3,queue.length),0,task);}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function study(){if(queue[0]?.phase!=='learn')return;stopVoice();const task=queue.shift();progress[task.id]='studied';enqueue({id:task.id,phase:'meaning'});save();render();}
function rate(value){if(!revealed||!current())return;stopVoice();const task=queue.shift();if(value==='again'){progress[task.id]='again';enqueue({id:task.id,phase:'meaning'});}else if(task.phase==='meaning'){progress[task.id]='meaning';enqueue({id:task.id,phase:'cloze'});}else{progress[task.id]='known';}save();render();}
function list(){const q=$('search').value.trim().toLocaleLowerCase();const rows=D.cards.filter(c=>[c.term,c.meaning,c.sentence,c.translation].join(' ').toLocaleLowerCase().includes(q));$('results').textContent=`找到 ${rows.length} 个词条`;$('words').replaceChildren();for(const c of rows){const el=document.createElement('article');el.className='word';const top=document.createElement('div');top.className='word-top';const term=document.createElement('strong');term.textContent=c.term;const status=document.createElement('span');status.className='hint';status.textContent=progress[c.id]==='known'?'本轮记住':progress[c.id]==='again'?'需要再练':progress[c.id]?'练习中':'未学习';top.append(term,status);el.append(top);for(const [txt,cls]of [[c.ipa,'muted'],[c.meaning,''],[c.sentence,'example'],[c.translation,'muted']]){const p=document.createElement('p');p.textContent=txt;p.className=cls;el.append(p);}$('words').append(el);}}
function switchMode(m){mode=m;$('study').hidden=m!=='study';$('list').hidden=m!=='list';$('study-tab').setAttribute('aria-pressed',m==='study');$('list-tab').setAttribute('aria-pressed',m==='list');if(m==='list')list();}
$('title').textContent=D.title;document.title=D.title+' · 剧有词';$('note').textContent=D.note;
for(const s of D.sources){const p=document.createElement('p');if(/^https?:\/\//i.test(s)){const a=document.createElement('a');a.href=s;a.textContent=s;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}else p.textContent=s;$('source-list').append(p);}
$('study-tab').onclick=()=>switchMode('study');$('list-tab').onclick=()=>switchMode('list');$('search').oninput=list;$('filter').onchange=rebuild;$('reveal').onclick=reveal;$('start').onclick=study;$('known').onclick=()=>rate('known');$('again').onclick=()=>rate('again');
$('shuffle').onclick=()=>{for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}render();};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){notify('当前浏览器不支持朗读，翻卡和复习仍可使用。');return;}const c=current();if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.sentence);u.lang='en-US';u.rate=.85;u.onerror=()=>notify('朗读暂不可用，请检查设备语音或网络。');speechSynthesis.speak(u);};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,deck_id:D.deck_id,progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vocab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('已导出学习进度。');};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const obj=JSON.parse(await f.text());if(obj.version!==1||obj.deck_id!==D.deck_id)throw Error('这份进度不属于当前词汇页');const p=cleanProgress(obj.progress);if(!confirm('导入会替换当前学习进度，继续吗？'))return;progress=p;save();rebuild();list();notify('进度已导入。');}catch(e){notify('导入失败：'+e.message);}finally{$('file').value='';}};
$('reset').onclick=()=>{if(!confirm('确定清除这一集的学习进度吗？'))return;progress={};save();rebuild();list();notify('已重置本集进度。');};
rebuild();
</script><script src="../assets/selection-tools.js"></script></body></html>
