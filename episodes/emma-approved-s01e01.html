:root{--bg:#f4f3ed;--ink:#213e39;--muted:#687772;--line:#d8dfd6;--green:#235a47;--soft:#e5ecdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:38px 28px 64px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:0;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(26px,4vw,40px);letter-spacing:0;margin:6px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.badge{border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-size:12px;white-space:nowrap}.stats{display:flex;gap:28px;margin:24px 0}.stats strong{font-size:28px;margin-right:8px}nav,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d99945;outline-offset:3px}.primary,button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.toolbar{justify-content:space-between;margin:22px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:32px 40px;min-height:370px;box-shadow:0 12px 35px #213e3906}.sentence{font-family:Georgia,serif;font-size:clamp(25px,4vw,36px);line-height:1.5;margin:28px 0;color:#193e33}.answer{border-top:1px solid var(--line);margin:22px 0;padding-top:18px}.term{font-size:22px;font-weight:650}.ipa{font-size:16px;color:var(--muted);font-weight:400;margin-left:12px}.actions{margin-top:24px}.bottom{justify-content:space-between;margin-top:18px;display:flex;gap:12px;align-items:center}.hint{font-size:12px;color:var(--muted <div class="stats" aria-label="学习统计"><div><strong id="total">0</strong>词条</div><div><strong id="learned">0</strong>本轮记住</div><div><strong id="remaining">0</strong>待完成</div></div>

</main><script type="application/json" id="vocab-data">{"title": "Emma Approved S01E01 - I am Emma Woodhouse", "deck_id": "emma-approved:S01E01:zh", "cards": [{"term": "intriguing", "meaning": "引人入胜的；很有吸引力的", "ipa": "/ɪnˈtriːɡɪŋ/", "sentence": "There are many intriguing female entrepreneurs in the love and lifestyle industry.", "translation": "爱情与生活方式行业里有许多引人注目的女性创业者。", "target_spans": [[15, 25]], "id": "90bda7603c4cfb1672bd"}, {"term": "have potential", "meaning": "有潜力", "ipa": "/hæv pəˈtenʃəl/", "sentence": "None are more dynamic or have more potential than young Miss Woodhouse.", "translation": "没有人比年轻的伍德豪斯小姐更有活力或更有潜力。", "target_spans": [[25, 44]], "id": "0d2f3b767cb1ce9eeca2"}, {"term": "in nine words", "meaning": "用九个词概括；简而言之", "ipa": "/ɪn naɪn wɜːrdz/", "sentence": "I know, complicated, but in nine words: I make your life better, and I never fail.", "translation": "我知道，很复杂，但用九个词概括：我让你的生活更美好，而且从不失败。", "target_spans": [[25, 38]], "id": "bc17ee88f5051d183c43"}, {"term": "hold a perfect record", "meaning": "保持全胜纪录", "ipa": "/həʊld ə ˈpɜːrfɪkt ˈrekərd/", "sentence": "Currently I hold a perfect 19 for 19 client success record.", "translation": "目前我的客户成功纪录是完美的十九战十九胜。", "target_spans": [[12, 58]], "id": "9a69ab278176ef217b6a"}, {"term": "blow the buttons off", "meaning": "令人惊艳；好得让人目瞪口呆", "ipa": "/bləʊ ðə ˈbʌtənz ɒf/", "sentence": "Her convection baking skills would blow the buttons off your cashmere cardigan.", "translation": "她的热风烘焙技术好得能让你羊绒开衫上的扣子都飞掉。", "target_spans": [[35, 55]], "id": "91a135ae639e0e34b00a"}, {"term": "put a ring on it", "meaning": "求婚；用戒指确定婚姻关系", "ipa": "/pʊt ə rɪŋ ɒn ɪt/", "sentence": "They put a ring on it!", "translation": "他们订婚了！", "target_spans": [[5, 21]], "id": "0ea9cb8dd37299c8dfde"}, {"term": "all because of", "meaning": "全都是因为", "ipa": "/ɔːl bɪˈkɒz əv/", "sentence": "And all because of me.", "translation": "而这一切都是因为我。", "target_spans": [[4, 18]], "id": "4295a54c6174421f8df0"}, {"term": "lock eyes", "meaning": "目光相遇；四目相对", "ipa": "/lɒk aɪz/", "sentence": "They may have never locked eyes across a crowded room.", "translation": "他们原本也许永远不会隔着拥挤的房间四目相对。", "target_spans": [[20, 31]], "id": "8f8353fc2f5d32cec5bd"}, {"term": "talk to oneself", "meaning": "自言自语", "ipa": "/tɔːk tə wʌnˈself/", "sentence": "Are you talking to yourself?", "translation": "你在自言自语吗？", "target_spans": [[8, 27]], "id": "bcf2649e8cb49e78c7d0"}, {"term": "for what purpose", "meaning": "出于什么目的", "ipa": "/fɔːr wɒt ˈpɜːrpəs/", "sentence": "For what purpose?", "translation": "出于什么目的？", "target_spans": [[0, 16]], "id": "76c212d90729f08d4af5"}, {"term": "lifetime achievement award", "meaning": "终身成就奖", "ipa": "/ˈlaɪftaɪm əˈtʃiːvmənt əˈwɔːrd/", "sentence": "Like when I receive my prestigious lifetime achievement award in lifestyle excellence.", "translation": "比如当我获得生活方式卓越领域的权威终身成就奖时。", "target_spans": [[35, 61]], "id": "624da7d26fd150d9be75"}, {"term": "one life at a time", "meaning": "一次改变一个人的生活", "ipa": "/wʌn laɪf æt ə taɪm/", "sentence": "Bettering the world one life at a time.", "translation": "一次改善一个人的生活，让世界变得更好。", "target_spans": [[20, 38]], "id": "e3ececbe298d72637169"}, {"term": "get a moment", "meaning": "有空；抽出一点时间", "ipa": "/ɡet ə ˈməʊmənt/", "sentence": "And, when you get a moment, I have some important boring stuff to talk about.", "translation": "等你有空时，我有些重要但无聊的事情要谈。", "target_spans": [[14, 26]], "id": "515520283c030fc9a363"}, {"term": "call in a favor", "meaning": "请人还个人情；动用关系帮忙", "ipa": "/kɔːl ɪn ə ˈfeɪvər/", "sentence": "I know they're a little rare this time of year, but I'll just call in a favor.", "translation": "我知道这种花每年这个时候有点稀有，但我找人帮个忙就行。", "target_spans": [[62, 77]], "id": "4168845f33fe05f187aa"}, {"term": "call someone back", "meaning": "给某人回电话", "ipa": "/kɔːl ˈsʌmwʌn bæk/", "sentence": "Sounded important, wants you to call her back?", "translation": "听起来很重要，她想让你回电话？", "target_spans": [[32, 45]], "id": "08d67fe1deff3f49a423"}, {"term": "without consent", "meaning": "未经同意", "ipa": "/wɪˈðaʊt kənˈsent/", "sentence": "You are aware that recording this conversation without my consent is technically illegal?", "translation": "你知道未经我同意录下这段对话严格来说是违法的吧？", "target_spans": [[47, 65]], "id": "fa6a8c17aa65d21ca20f"}, {"term": "get back to", "meaning": "稍后再处理或讨论", "ipa": "/ɡet bæk tuː/", "sentence": "We'll get back to that later, but for now...", "translation": "我们之后再谈那个，不过现在……", "target_spans": [[6, 17]], "id": "5623150f0f1f6ceac520"}, {"term": "call off", "meaning": "取消", "ipa": "/kɔːl ɒf/", "sentence": "Emma, I'm thinking... about calling off the wedding.", "translation": "艾玛，我在考虑……取消婚礼。", "target_spans": [[28, 39]], "id": "d03e7a9f1315f82562e9"}], "sources": ["https://www.youtube.com/watch?v=aeeXkf8LZ_8", "https://nerdfighteria.info/v/aeeXkf8LZ_8"], "note": ""}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('vocab-data').textContent), $=id=>document.getElementById(id);
const key='series-vocab:v1:'+D.deck_id, ids=new Set(D.cards.map(c=>c.id));
let progress={}, queue=[],revealed=false,mode='study';
const cardById=new Map(D.cards.map(c=>[c.id,c]));
function notify(s){$('notice').textContent=s;}
function cleanProgress(p){if(!p||typeof p!=='object'||Array.isArray(p))throw Error('进度格式不正确');const out={};for(const [id,v] of Object.entries(p)){if(!ids.has(id))continue;if(!['known','again','studied','meaning'].includes(v))throw Error('进度状态不正确');out[id]=v;}return out;}
try{const saved=localStorage.getItem(key);if(saved)progress=cleanProgress(JSON.parse(saved));}catch(e){notify('无法读取本地进度；本次仍可学习，请使用导出进度保存。');}
function save(){try{localStorage.setItem(key,JSON.stringify(progress));}catch(e){notify('浏览器未允许保存进度，请点击“导出进度”备份。');}}
function stats(){$('total').textContent=D.cards.length;const n=D.cards.filter(c=>progress[c.id]==='known').length;$('learned').textContent=n;$('remaining').textContent=D.cards.length-n;}
function current(){return queue.length?cardById.get(queue[0].id):null;}
function rebuild(){queue=D.cards.filter(c=>$('filter').value==='all'||($('filter').value==='again'?progress[c.id]==='again':progress[c.id]!=='known')).map(c=>({id:c.id,phase:!progress[c.id]?'learn':progress[c.id]==='meaning'?'cloze':'meaning'}));render();}
function sentence(c,blank){$('sentence').replaceChildren();let at=0;for(const [start,end] of c.target_spans){$('sentence').append(document.createTextNode(c.sentence.slice(at,start)));const m=document.createElement('mark');m.textContent=blank?'________':c.sentence.slice(start,end);$('sentence').append(m);at=end;}$('sentence').append(document.createTextNode(c.sentence.slice(at)));}
function render(){stats();revealed=false;$('ratings').hidden=true;const c=current();const phase=queue[0]?.phase;
for(const id of ['start','reveal','speak'])$(id).hidden=!c;
$('answer').hidden=!c||phase!=='learn';$('target').hidden=!c;
if(!c){$('position').textContent='本组练习完成';$('sentence').textContent='休息一下吧。之后可以选择“全部复习”再练。';$('prompt').textContent='本轮记住不等于长期掌握，建议过几天再回来复习。';return;}
$('position').textContent=({learn:'01 · 学习新词',meaning:'02 · 回忆词义',cloze:'03 · 回想英文'})[phase]+` · 队列剩余 ${queue.length} 项`;
$('target').textContent=phase==='cloze'?c.meaning:c.term;
$('prompt').textContent=phase==='learn'?'看词义，再结合原句理解。准备好后，稍后会考你。':phase==='meaning'?'标出的词或短语在这句话中是什么意思？':'根据中文意思，回想空格处的英文（按原句形式）。';
sentence(c,phase==='cloze');
for(const f of ['term','ipa','meaning','translation'])$(f).textContent=c[f];
$('start').hidden=phase!=='learn';$('reveal').hidden=phase==='learn';$('reveal').textContent='核对答案';$('speak').hidden=phase==='cloze';}
function reveal(){const c=current();if(!c||queue[0].phase==='learn')return;revealed=true;$('answer').hidden=false;$('ratings').hidden=false;$('reveal').hidden=true;$('speak').hidden=false;if(queue[0].phase==='cloze')sentence(c,false);}
function enqueue(task){queue.splice(Math.min(3,queue.length),0,task);}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function study(){if(queue[0]?.phase!=='learn')return;stopVoice();const task=queue.shift();progress[task.id]='studied';enqueue({id:task.id,phase:'meaning'});save();render();}
function rate(value){if(!revealed||!current())return;stopVoice();const task=queue.shift();if(value==='again'){progress[task.id]='again';enqueue({id:task.id,phase:'meaning'});}else if(task.phase==='meaning'){progress[task.id]='meaning';enqueue({id:task.id,phase:'cloze'});}else{progress[task.id]='known';}save();render();}
function list(){const q=$('search').value.trim().toLocaleLowerCase();const rows=D.cards.filter(c=>[c.term,c.meaning,c.sentence,c.translation].join(' ').toLocaleLowerCase().includes(q));$('results').textContent=`找到 ${rows.length} 个词条`;$('words').replaceChildren();for(const c of rows){const el=document.createElement('article');el.className='word';const top=document.createElement('div');top.className='word-top';const term=document.createElement('strong');term.textContent=c.term;const status=document.createElement('span');status.className='hint';status.textContent=progress[c.id]==='known'?'本轮记住':progress[c.id]==='again'?'需要再练':progress[c.id]?'练习中':'未学习';top.append(term,status);el.append(top);for(const [txt,cls]of [[c.ipa,'muted'],[c.meaning,''],[c.sentence,'example'],[c.translation,'muted']]){const p=document.createElement('p');p.textContent=txt;p.className=cls;el.append(p);}$('words').append(el);}}
function switchMode(m){mode=m;$('study').hidden=m!=='study';$('list').hidden=m!=='list';$('study-tab').setAttribute('aria-pressed',m==='study');$('list-tab').setAttribute('aria-pressed',m==='list');if(m==='list')list();}
$('title').textContent=D.title;document.title=D.title+' · 剧有词';$('note').textContent=D.note;
for(const s of D.sources){const p=document.createElement('p');if(/^https?:\/\//i.test(s)){const a=document.createElement('a');a.href=s;a.textContent=s;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}else p.textContent=s;$('source-list').append(p);}
$('study-tab').onclick=()=>switchMode('study');$('list-tab').onclick=()=>switchMode('list');$('search').oninput=list;$('filter').onchange=rebuild;$('reveal').onclick=reveal;$('start').onclick=study;$('known').onclick=()=>rate('known');$('again').onclick=()=>rate('again');
$('shuffle').onclick=()=>{for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}render();};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){notify('当前浏览器不支持朗读，翻卡和复习仍可使用。');return;}const c=current();if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.sentence);u.lang='en-US';u.rate=.85;u.onerror=()=>notify('朗读暂不可用，请检查设备语音或网络。');speechSynthesis.speak(u);};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,deck_id:D.deck_id,progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vocab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('已导出学习进度。');};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const obj=JSON.parse(await f.text());if(obj.version!==1||obj.deck_id!==D.deck_id)throw Error('这份进度不属于当前词汇页');const p=cleanProgress(obj.progress);if(!confirm('导入会替换当前学习进度，继续吗？'))return;progress=p;save();rebuild();list();notify('进度已导入。');}catch(e){notify('导入失败：'+e.message);}finally{$('file').value='';}};
$('reset').onclick=()=>{if(!confirm('确定清除这一集的学习进度吗？'))return;progress={};save();rebuild();list();notify('已重置本集进度。');};
rebuild();
</script><script src="../assets/selection-tools.js"></script></body></html>
