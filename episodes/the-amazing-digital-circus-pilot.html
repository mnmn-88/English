:root{--bg:#f4f3ed;--ink:#213e39;--muted:#687772;--line:#d8dfd6;--green:#235a47;--soft:#e5ecdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:38px 28px 64px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:0;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(26px,4vw,40px);letter-spacing:0;margin:6px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.badge{border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-size:12px;white-space:nowrap}.stats{display:flex;gap:28px;margin:24px 0}.stats strong{font-size:28px;margin-right:8px}nav,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d99945;outline-offset:3px}.primary,button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.toolbar{justify-content:space-between;margin:22px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:32px 40px;min-height:370px;box-shadow:0 12px 35px #213e3906}.sentence{font-family:Georgia,serif;font-size:clamp(25px,4vw,36px);line-height:1.5;margin:28px 0;color:#193e33}.answer{border-top:1px solid var(--line);margin:22px 0;padding-top:18px}.term{font-size:22px;font-weight:650}.ipa{font-size:16px;color:var(--muted);font-weight:400;margin-left:12px}.actions{margin-top:24px}.bottom{justify-content:space-between;margin-top:18px;display:flex;gap:12px;align-items:center}.hint{font-size:12px;color:var(--muted)}input[type=search]{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:white;margin:22px 0}.word{background:white;border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:12px}.word-top{display:flex;justify-content:space-between;gap:12px}.word p{overflow-wrap:anywhere}.word .example{font-family:Georgia,serif;font-size:20px}footer{margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}footer .actions{margin-top:12px}#notice{min-height:24px;color:#855220;font-size:14px}#source-list{overflow-wrap:anywhere}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:620px){main{padding:24px 16px}header{display:block}.badge{display:inline-block;margin-top:10px}.card{padding:22px;min-height:360px}.stats{gap:18px}.stats strong{font-size:23px}.bottom{align-items:flex-start;flex-direction:column}.actions button{flex:1}.word{padding:16px}}

<div class="stats" aria-label="学习统计"><div><strong id="total">0</strong>词条</div><div><strong id="learned">0</strong>本轮记住</div><div><strong id="remaining">0</strong>待完成</div></div>

</main><script type="application/json" id="vocab-data">{"title": "The Amazing Digital Circus Pilot", "deck_id": "the-amazing-digital-circus:pilot:zh", "cards": [{"term": "jaw-dropping", "meaning": "令人惊叹的；惊掉下巴的", "ipa": "/ˈdʒɔː ˌdrɒpɪŋ/", "sentence": "I'm here to show you the most jaw-dropping, heart-stopping, mind-bending paraphernalia you've ever laid your eyes upon!", "translation": "我来这里是要给你们展示最令人惊叹、心跳停止、颠覆认知的奇妙玩意儿！", "target_spans": [[30, 42]], "id": "5c708dbe9191abf88fed"}, {"term": "get right into", "meaning": "马上开始；直接进入", "ipa": "/ɡet raɪt ˈɪntuː/", "sentence": "Let's get right into the show!", "translation": "让我们马上开始表演吧！", "target_spans": [[6, 20]], "id": "ff55ab347ea021ff847d"}, {"term": "realm", "meaning": "领域；世界", "ipa": "/relm/", "sentence": "It appears a new human has entered this realm!", "translation": "看来有一位新人类进入了这个世界！", "target_spans": [[40, 45]], "id": "eeb6e94035f3d1f04f51"}, {"term": "foul language", "meaning": "粗话；脏话", "ipa": "/faʊl ˈlæŋɡwɪdʒ/", "sentence": "We can't have any of that foul language around here.", "translation": "我们这里可不能出现那些粗话。", "target_spans": [[26, 39]], "id": "cd224a93dfaac7a7937e"}, {"term": "stumbled into", "meaning": "误打误撞进入；偶然闯入", "ipa": "/ˈstʌmbəld ˈɪntuː/", "sentence": "You, my friend, stumbled into an incredible world of wonders, where anything can happen!", "translation": "我的朋友，你误打误撞进入了一个不可思议的奇妙世界，在这里任何事都可能发生！", "target_spans": [[16, 29]], "id": "1c143e12ac0b79864498"}, {"term": "freak out", "meaning": "惊慌失措；情绪失控", "ipa": "/friːk aʊt/", "sentence": "Well, don't freak out about it or anything, but, uh, we don't exactly...", "translation": "这个，你先别惊慌，不过我们其实不太……", "target_spans": [[12, 21]], "id": "818da9d6f399f91d99e6"}, {"term": "play along", "meaning": "配合着演；将计就计", "ipa": "/pleɪ əˈlɒŋ/", "sentence": "This is a dream, and I should just play along until I wake up, right?", "translation": "这是个梦，我只要配合着演到醒来就行，对吧？", "target_spans": [[35, 45]], "id": "60814bd545eee4e11912"}, {"term": "living quarters", "meaning": "住处；生活区", "ipa": "/ˈlɪvɪŋ ˈkwɔːrtərz/", "sentence": "This is where your living quarters are, as well as all sorts of other activities!", "translation": "这里是你们的住处，也有各种各样的活动！", "target_spans": [[19, 34]], "id": "f02197127867ab790d17"}, {"term": "all-seeing", "meaning": "洞察一切的；无所不见的", "ipa": "/ˌɔːl ˈsiːɪŋ/", "sentence": "We stay right here, where I can keep my hundreds of all-seeing eyes on you.", "translation": "我们就待在这里，这样我那几百只洞察一切的眼睛就能盯着你们。", "target_spans": [[52, 62]], "id": "2015cd01948abfaa0024"}, {"term": "clean up on aisle", "meaning": "某条过道需要清理（商店广播用语）", "ipa": "/kliːn ʌp ɒn aɪl/", "sentence": "Woah, clean up on aisle you!", "translation": "哇哦，“你”这条过道需要清理！", "target_spans": [[6, 23]], "id": "c13d0d542b777a0ef7f4"}, {"term": "assure you", "meaning": "向你保证", "ipa": "/əˈʃʊr juː/", "sentence": "I assure you, there is no magical exit door.", "translation": "我向你保证，根本没有什么神奇的出口门。", "target_spans": [[2, 12]], "id": "5903fc3e277f313d87b0"}, {"term": "come up with", "meaning": "想出；提出", "ipa": "/kʌm ʌp wɪð/", "sentence": "So, all I can help you with is coming up with a new one.", "translation": "所以我能帮你的只有想一个新名字。", "target_spans": [[31, 45]], "id": "3a0a39a5d12f95134add"}, {"term": "warm you up", "meaning": "让你先热身；使你进入状态", "ipa": "/wɔːrm juː ʌp/", "sentence": "We're gonna make it a simple, in-house adventure to warm you up to how things work around here.", "translation": "我们会安排一次简单的室内冒险，让你先熟悉这里的运作方式。", "target_spans": [[52, 63]], "id": "d5397035eba183f9d2a7"}, {"term": "get involved with", "meaning": "参与；卷入", "ipa": "/ɡet ɪnˈvɒlvd wɪð/", "sentence": "I'll make it something unobtrusive that you can still choose to not get involved with!", "translation": "我会把它弄得不碍事，你仍然可以选择不参与！", "target_spans": [[68, 85]], "id": "de3d89ae948f51afb532"}, {"term": "run into", "meaning": "碰到；撞上", "ipa": "/rʌn ˈɪntuː/", "sentence": "Gloinks are small mischievous critters that steal anything and everything they run into!", "translation": "格洛因克是淘气的小生物，会偷走它们碰到的一切！", "target_spans": [[79, 87]], "id": "ba4a634460ee2c50e99d"}, {"term": "jump-start", "meaning": "提前启动；抢先开始", "ipa": "/ˈdʒʌmp stɑːrt/", "sentence": "Could also mean you just have a jump-start on losing your mind.", "translation": "也可能只是说明你比别人更早开始失去理智。", "target_spans": [[32, 42]], "id": "32fe7daac2bf240f35b1"}], "sources": ["https://tadc.fandom.com/wiki/The_Amazing_Digital_Circus_(Pilot)/Transcript", "https://www.youtube.com/watch?v=HwAPLk_sQ3w"], "note": ""}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('vocab-data').textContent), $=id=>document.getElementById(id);
const key='series-vocab:v1:'+D.deck_id, ids=new Set(D.cards.map(c=>c.id));
let progress={}, queue=[],revealed=false,mode='study';
const cardById=new Map(D.cards.map(c=>[c.id,c]));
function notify(s){$('notice').textContent=s;}
function cleanProgress(p){if(!p||typeof p!=='object'||Array.isArray(p))throw Error('进度格式不正确');const out={};for(const [id,v] of Object.entries(p)){if(!ids.has(id))continue;if(!['known','again','studied','meaning'].includes(v))throw Error('进度状态不正确');out[id]=v;}return out;}
try{const saved=localStorage.getItem(key);if(saved)progress=cleanProgress(JSON.parse(saved));}catch(e){notify('无法读取本地进度；本次仍可学习，请使用导出进度保存。');}
function save(){try{localStorage.setItem(key,JSON.stringify(progress));}catch(e){notify('浏览器未允许保存进度，请点击“导出进度”备份。');}}
function stats(){$('total').textContent=D.cards.length;const n=D.cards.filter(c=>progress[c.id]==='known').length;$('learned').textContent=n;$('remaining').textContent=D.cards.length-n;}
function current(){return queue.length?cardById.get(queue[0].id):null;}
function rebuild(){queue=D.cards.filter(c=>$('filter').value==='all'||($('filter').value==='again'?progress[c.id]==='again':progress[c.id]!=='known')).map(c=>({id:c.id,phase:!progress[c.id]?'learn':progress[c.id]==='meaning'?'cloze':'meaning'}));render();}
function sentence(c,blank){$('sentence').replaceChildren();let at=0;for(const [start,end] of c.target_spans){$('sentence').append(document.createTextNode(c.sentence.slice(at,start)));const m=document.createElement('mark');m.textContent=blank?'________':c.sentence.slice(start,end);$('sentence').append(m);at=end;}$('sentence').append(document.createTextNode(c.sentence.slice(at)));}
function render(){stats();revealed=false;$('ratings').hidden=true;const c=current();const phase=queue[0]?.phase;
for(const id of ['start','reveal','speak'])$(id).hidden=!c;
$('answer').hidden=!c||phase!=='learn';$('target').hidden=!c;
if(!c){$('position').textContent='本组练习完成';$('sentence').textContent='休息一下吧。之后可以选择“全部复习”再练。';$('prompt').textContent='本轮记住不等于长期掌握，建议过几天再回来复习。';return;}
$('position').textContent=({learn:'01 · 学习新词',meaning:'02 · 回忆词义',cloze:'03 · 回想英文'})[phase]+` · 队列剩余 ${queue.length} 项`;
$('target').textContent=phase==='cloze'?c.meaning:c.term;
$('prompt').textContent=phase==='learn'?'看词义，再结合原句理解。准备好后，稍后会考你。':phase==='meaning'?'标出的词或短语在这句话中是什么意思？':'根据中文意思，回想空格处的英文（按原句形式）。';
sentence(c,phase==='cloze');
for(const f of ['term','ipa','meaning','translation'])$(f).textContent=c[f];
$('start').hidden=phase!=='learn';$('reveal').hidden=phase==='learn';$('reveal').textContent='核对答案';$('speak').hidden=phase==='cloze';}
function reveal(){const c=current();if(!c||queue[0].phase==='learn')return;revealed=true;$('answer').hidden=false;$('ratings').hidden=false;$('reveal').hidden=true;$('speak').hidden=false;if(queue[0].phase==='cloze')sentence(c,false);}
function enqueue(task){queue.splice(Math.min(3,queue.length),0,task);}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel();}
function study(){if(queue[0]?.phase!=='learn')return;stopVoice();const task=queue.shift();progress[task.id]='studied';enqueue({id:task.id,phase:'meaning'});save();render();}
function rate(value){if(!revealed||!current())return;stopVoice();const task=queue.shift();if(value==='again'){progress[task.id]='again';enqueue({id:task.id,phase:'meaning'});}else if(task.phase==='meaning'){progress[task.id]='meaning';enqueue({id:task.id,phase:'cloze'});}else{progress[task.id]='known';}save();render();}
function list(){const q=$('search').value.trim().toLocaleLowerCase();const rows=D.cards.filter(c=>[c.term,c.meaning,c.sentence,c.translation].join(' ').toLocaleLowerCase().includes(q));$('results').textContent=`找到 ${rows.length} 个词条`;$('words').replaceChildren();for(const c of rows){const el=document.createElement('article');el.className='word';const top=document.createElement('div');top.className='word-top';const term=document.createElement('strong');term.textContent=c.term;const status=document.createElement('span');status.className='hint';status.textContent=progress[c.id]==='known'?'本轮记住':progress[c.id]==='again'?'需要再练':progress[c.id]?'练习中':'未学习';top.append(term,status);el.append(top);for(const [txt,cls]of [[c.ipa,'muted'],[c.meaning,''],[c.sentence,'example'],[c.translation,'muted']]){const p=document.createElement('p');p.textContent=txt;p.className=cls;el.append(p);}$('words').append(el);}}
function switchMode(m){mode=m;$('study').hidden=m!=='study';$('list').hidden=m!=='list';$('study-tab').setAttribute('aria-pressed',m==='study');$('list-tab').setAttribute('aria-pressed',m==='list');if(m==='list')list();}
$('title').textContent=D.title;document.title=D.title+' · 剧有词';$('note').textContent=D.note;
for(const s of D.sources){const p=document.createElement('p');if(/^https?:\/\//i.test(s)){const a=document.createElement('a');a.href=s;a.textContent=s;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}else p.textContent=s;$('source-list').append(p);}
$('study-tab').onclick=()=>switchMode('study');$('list-tab').onclick=()=>switchMode('list');$('search').oninput=list;$('filter').onchange=rebuild;$('reveal').onclick=reveal;$('start').onclick=study;$('known').onclick=()=>rate('known');$('again').onclick=()=>rate('again');
$('shuffle').onclick=()=>{for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}render();};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){notify('当前浏览器不支持朗读，翻卡和复习仍可使用。');return;}const c=current();if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.sentence);u.lang='en-US';u.rate=.85;u.onerror=()=>notify('朗读暂不可用，请检查设备语音或网络。');speechSynthesis.speak(u);};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,deck_id:D.deck_id,progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vocab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('已导出学习进度。');};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const obj=JSON.parse(await f.text());if(obj.version!==1||obj.deck_id!==D.deck_id)throw Error('这份进度不属于当前词汇页');const p=cleanProgress(obj.progress);if(!confirm('导入会替换当前学习进度，继续吗？'))return;progress=p;save();rebuild();list();notify('进度已导入。');}catch(e){notify('导入失败：'+e.message);}finally{$('file').value='';}};
$('reset').onclick=()=>{if(!confirm('确定清除这一集的学习进度吗？'))return;progress={};save();rebuild();list();notify('已重置本集进度。');};
rebuild();
</script><script src="../assets/selection-tools.js"></script></body></html>
